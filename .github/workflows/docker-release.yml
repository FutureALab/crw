name: Docker Image Release

# Builds the container image for this repo, `docker save`s it into a
# downloadable archive per architecture, and attaches those archives to the
# GitHub Release — so a self-hoster can `docker load` a pinned image without
# pulling from a registry.
#
# This is deliberately NOT the GHCR publisher. release.yml's `publish-docker`
# job stays the single source of the pushed multi-arch manifest; pushing here
# too would race it for no benefit. This workflow only produces the archives.
#
# Two refs decide the build and they are normally the same one (the release
# tag): the Rust source, and the container recipe (`Dockerfile` + `docker/`).
# `packaging_ref` splits them on purpose, so a release whose tag predates a
# stage can still ship a working archive — every tag before the bundled-Chromium
# `runtime-js` stage is that case.
on:
  # `published` (not `created`/`edited`): the release object has to exist before
  # the attach job runs, or `gh release upload` has nowhere to put the assets.
  release:
    types: [published]
  # Manual recovery for a tag whose release already exists. Idempotent —
  # uploads use --clobber, so re-running replaces the archives instead of
  # failing on a name collision. Passing `source_ref` instead makes it a
  # build-only dry run (see that input).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the image archives to (e.g. v0.35.1)."
        required: true
      source_ref:
        description: "Optional. Build from this ref (branch, tag, or commit SHA) instead of the release tag — a build-only dry run that skips the release upload. Use it to validate the pipeline before the tag exists."
        required: false
        default: ""
      image_target:
        description: "Optional. Dockerfile target to build. Default runtime-js = self-contained image with the Chromium JS renderer baked in and started by the entrypoint. runtime = the lean image, which ships no renderer and expects a CDP sidecar."
        required: false
        default: "runtime-js"
      packaging_ref:
        description: "Optional. Take the container recipe (`Dockerfile` + `docker/`) from this ref while the Rust source still comes from the release tag. Use it to rebuild an older release with a newer recipe — e.g. a tag that predates the bundled-renderer `runtime-js` stage, which would otherwise ship a browser-less image. Leave empty to build the tag's own recipe."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: docker-image-release-${{ github.event.inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release-context:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ctx.outputs.tag }}
      version: ${{ steps.ctx.outputs.version }}
      image: ${{ steps.ctx.outputs.image }}
      checkout_ref: ${{ steps.ctx.outputs.checkout_ref }}
      # 'true' unless this is a build-only dry run; gates the release upload.
      attach: ${{ steps.ctx.outputs.attach }}
      image_target: ${{ steps.ctx.outputs.image_target }}
      packaging_ref: ${{ steps.ctx.outputs.packaging_ref }}
    steps:
      - id: ctx
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
            [ -n "$tag" ] || { echo "::error::workflow_dispatch requires the tag input"; exit 1; }
            source_ref="${{ inputs.source_ref }}"
            image_target="${{ inputs.image_target }}"
            [ -n "$image_target" ] || image_target=runtime-js
            packaging_ref="${{ inputs.packaging_ref }}"
          else
            tag="${{ github.event.release.tag_name }}"
            [ -n "$tag" ] || { echo "::error::could not read the release tag from the event"; exit 1; }
            source_ref=""
            # A published release always ships the self-contained image; the
            # lean target is a dispatch-only choice.
            image_target=runtime-js
            # A release event builds the tag's own recipe: borrowing a recipe
            # from a later ref is a recovery move, and it stays dispatch-only.
            packaging_ref=""
          fi
          # Same semver gate as release.yml: a non-version tag has no meaningful
          # `{{version}}` to tag the image with, so refuse rather than ship an
          # archive whose tag nobody can predict.
          echo "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' \
            || { echo "::error::tag '$tag' is not semver (expected e.g. v0.35.1)"; exit 1; }
          version="${tag#v}"
          # Registry references must be lowercase; a mixed-case owner/repo would
          # otherwise be rejected by the daemon at build time.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          # Allowlist instead of passing the input straight into `--target`:
          # a typo would otherwise fail the build ~30 minutes in, after the
          # Rust compile, with an opaque "target stage not found" error.
          case "$image_target" in
            runtime|runtime-js) ;;
            *) echo "::error::image_target '$image_target' is not a target in the Dockerfile (runtime | runtime-js)"
               exit 1 ;;
          esac

          # A build-only dry run (source_ref given and different from the tag)
          # never touches the release: archives stay as run artifacts. Attaching
          # an image built from main to a release tag would be silent
          # mislabelling, which is exactly what the release pipeline must not do.
          if [ -n "$source_ref" ] && [ "$source_ref" != "$tag" ]; then
            attach=false
            checkout_ref="$source_ref"
            # `/commits/{ref}` resolves a branch, a tag or a SHA alike, so a
            # typo (e.g. `master` on this `main` repo) fails here in seconds
            # with the real branch list, instead of surfacing as an opaque
            # `git failed with exit code 1` from actions/checkout after three
            # fetch retries.
            if ! gh api "repos/${GITHUB_REPOSITORY}/commits/${source_ref}" >/dev/null 2>&1; then
              branches="$(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' 2>/dev/null | head -20 | paste -sd', ' - || true)"
              echo "::error::source_ref '$source_ref' does not resolve to a branch, tag or commit in ${GITHUB_REPOSITORY} (branches: ${branches:-could not be listed})"
              exit 1
            fi
            echo "::notice::dry run — building from '$source_ref'; archives will NOT be attached to release '$tag'"
          else
            attach=true
            # A fully-qualified ref: `actions/checkout` with a bare `v0.35.1`
            # also globs refs/heads/v0.35.1*, and the failure mode when the tag
            # is missing is an opaque `git ... exit code 1` after three retries.
            checkout_ref="refs/tags/${tag}"
            # Fail here, in seconds, instead of after the heavy matrix: a tag
            # that does not exist upstream (e.g. this repo has no tags yet, or
            # release-please never cut it) means checkout cannot resolve the ref
            # and there is no release to attach to either.
            if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "::error::tag '$tag' does not exist in ${GITHUB_REPOSITORY} — push the tag (or let release-please cut the release) first, or re-run with source_ref set to a branch, tag or SHA for a build-only dry run"
              exit 1
            fi
          fi

          # `--target` only resolves against the tree being built, so a missing
          # stage is decided by the ref, not by the input: either the release
          # tag predates the stage (v0.35.1 predates the bundled-Chromium
          # `runtime-js` stage, which is how a browser-less archive shipped) or
          # `packaging_ref` points at a ref that never had it. Decide it here,
          # in seconds — the matrix legs below would otherwise find out ~30
          # minutes in, after the Rust compile, as a bare "target stage could
          # not be found" that reads like a typo.
          if [ -n "$packaging_ref" ]; then
            if ! gh api "repos/${GITHUB_REPOSITORY}/commits/${packaging_ref}" >/dev/null 2>&1; then
              echo "::error::packaging_ref '$packaging_ref' does not resolve to a branch, tag or commit in ${GITHUB_REPOSITORY}"
              exit 1
            fi
            dockerfile_ref="$packaging_ref"
          else
            # Dry runs build `source_ref`; everything else builds the tag.
            dockerfile_ref="${source_ref:-$tag}"
          fi
          # Read the Dockerfile out of that ref without a checkout: the
          # contents API resolves a branch, a tag or a SHA alike.
          dockerfile="$(gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${GITHUB_REPOSITORY}/contents/Dockerfile?ref=${dockerfile_ref}" 2>/dev/null || true)"
          if ! grep -qE "^FROM .* AS ${image_target}$" <<<"$dockerfile"; then
            echo "::group::FROM lines in ${dockerfile_ref}'s Dockerfile"
            grep -nE '^FROM ' <<<"$dockerfile" || echo "(no Dockerfile readable at ${dockerfile_ref})"
            echo "::endgroup::"
            if [ -n "$packaging_ref" ]; then
              echo "::error::packaging_ref '$packaging_ref' has no '${image_target}' stage in its Dockerfile — point it at a ref that has one (main does), or dispatch with image_target=runtime for the lean sidecar image"
            elif [ "$image_target" = "runtime-js" ]; then
              echo "::error::Dockerfile at ${checkout_ref} has no 'runtime-js' stage — that ref predates the bundled-renderer image, so an archive built from it ships without a browser. Dispatch with packaging_ref=<ref> to rebuild this tag's own source with a newer container recipe (the Dockerfile and docker/ come from that ref; the Rust code still comes from ${checkout_ref}), re-point the release at a commit that has the stage, or dispatch with image_target=runtime for the lean sidecar image."
            else
              echo "::error::Dockerfile at ${checkout_ref} has no '${image_target}' stage — this ref predates named runtime stages (its final stage is unnamed), so it cannot be addressed with --target at all. Dispatch with packaging_ref=<ref> to rebuild this tag's own source with a newer container recipe (the Dockerfile and docker/ come from that ref; the Rust code still comes from ${checkout_ref})."
            fi
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "image=$image"
            echo "checkout_ref=$checkout_ref"
            echo "attach=$attach"
            echo "image_target=$image_target"
            echo "packaging_ref=$packaging_ref"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::docker image release context: tag=$tag version=$version image=$image ref=$checkout_ref attach=$attach target=$image_target recipe=${dockerfile_ref}"

  build-and-save:
    needs: release-context
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # One leg per architecture. `docker save` cannot represent a
          # multi-arch manifest in a single loadable archive, so each platform
          # is built and saved on its own and shipped as its own asset.
          #
          # Both legs run on ubuntu-latest + QEMU. That is affordable here
          # because the Dockerfile compiles on $BUILDPLATFORM (the aarch64 leg
          # cross-compiles natively); only the runtime stage and the smoke run
          # below execute under emulation. Swap the arm64 `runner` to a native
          # `ubuntu-24.04-arm` label to speed that leg up if the repo has the
          # runners available.
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ needs.release-context.outputs.checkout_ref }}

      # The release tag decides the Rust source; the container recipe can come
      # from a ref that has the stage the tag predates (see `packaging_ref`).
      # Only Dockerfile + docker/ are borrowed, so the compiled code stays the
      # release's: what is rebuilt is how this release is packaged, not what is
      # inside it.
      - name: Borrow the container recipe
        if: ${{ needs.release-context.outputs.packaging_ref != '' }}
        shell: bash
        env:
          PACKAGING_REF: ${{ needs.release-context.outputs.packaging_ref }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          # `git fetch` + a pathspec checkout rather than a second checkout:
          # the working tree being compiled has to stay the tag's.
          git fetch --depth=1 origin "$PACKAGING_REF"
          git checkout FETCH_HEAD -- Dockerfile
          # Only pull docker/ in when that ref actually has it, so a recipe that
          # does not COPY anything from there still applies cleanly.
          if git cat-file -e 'FETCH_HEAD:docker/crw-entrypoint.sh' 2>/dev/null; then
            git checkout FETCH_HEAD -- docker
          fi
          echo "::warning::container recipe (Dockerfile + docker/) taken from '${PACKAGING_REF}'; the code in this image is still ${source_sha}"

      # A tag can point at a commit older than the Dockerfile change that added
      # `runtime-js`. `docker buildx --target` then fails with a bare
      # "target stage could not be found" that reads like a typo, while the real
      # problem is that the tagged tree predates the bundled-renderer image.
      # `release-context` already refuses that combination in seconds; this
      # re-checks the tree that is actually about to be built (after any recipe
      # swap), so the gate lives with the build rather than only upstream of it.
      - name: Verify the requested target exists in this ref
        shell: bash
        env:
          TARGET: ${{ needs.release-context.outputs.image_target }}
          REF: ${{ needs.release-context.outputs.checkout_ref }}
        run: |
          set -euo pipefail
          if ! grep -qE "^FROM .* AS ${TARGET}$" Dockerfile; then
            echo "::error::the Dockerfile built from ${REF} has no '${TARGET}' stage. Re-point the release at a commit that has it, dispatch with packaging_ref=<ref> to borrow a newer container recipe, or dispatch with image_target=runtime for the lean sidecar image."
            echo "::group::stages available at ${REF}"
            grep -nE '^FROM ' Dockerfile || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Labels only: the image tags are built from the release context below so
      # the exact strings the archive carries are visible in this file.
      - name: Extract OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.release-context.outputs.image }}
          # Label the artifact with the commit actually checked out. Default is
          # github.sha, which for a release event is the tagged commit — but this
          # job may build a different ref (dry run, or a re-pointed tag), and a
          # revision label that lies about its provenance is worse than none.
          revision: ${{ steps.checkout.outputs.commit }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-context.outputs.tag }}

      # Loads the image into the local daemon (no push) so it can be smoke-run
      # and `docker save`d. The docker exporter only accepts a single platform,
      # which is why this job is a per-arch matrix.
      #
      # No `cache-to: type=gha`, for the reason documented in release.yml: a run
      # on a tag ref can only restore its own ref plus the default branch, so
      # the ~2GB written per release would never be read back.
      - name: Build image (no push) and load it locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          # runtime-js bakes Chromium in and starts it from the image
          # entrypoint (LightPanda cannot be baked onto this base — upstream
          # needs glibc 2.38, see the Dockerfile). The Dockerfile's default
          # target (`runtime`) ships no JS renderer at all — correct for
          # docker-compose, which supplies sidecars, but useless for an archive
          # somebody downloads and `docker run`s on its own, which is what this
          # workflow hands out.
          target: ${{ needs.release-context.outputs.image_target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            ${{ needs.release-context.outputs.image }}:${{ needs.release-context.outputs.version }}
            ${{ needs.release-context.outputs.image }}:${{ needs.release-context.outputs.version }}-linux-${{ matrix.arch }}

      # Proves the bytes about to be shipped actually run on their own
      # architecture before they become a release asset. The arm64 leg executes
      # this under QEMU.
      - name: Smoke-test the loaded image
        shell: bash
        env:
          IMAGE: ${{ needs.release-context.outputs.image }}
          VERSION: ${{ needs.release-context.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ needs.release-context.outputs.image_target }}
        run: |
          set -euo pipefail
          # The image ships all three workspace binaries (CARGO_PKGS default in
          # the Dockerfile); a missing one would mean a silently trimmed image.
          docker run --rm --platform "$PLATFORM" \
            --entrypoint /bin/sh "${IMAGE}:${VERSION}" \
            -c 'ls -l /usr/local/bin/crw /usr/local/bin/crw-server /usr/local/bin/crw-mcp'
          # runtime-js is the whole reason this workflow exists: an archive
          # somebody downloads has to render JS with no sidecar. Assert the
          # baked backend really is inside it — a target mix-up already shipped
          # a browser-less archive once — and hand off through the entrypoint,
          # so the browser starts the way a self-hoster's `docker run` starts
          # it. A backend that fails to come up degrades to "no renderer"
          # without failing the run, by design (see docker/crw-entrypoint.sh).
          if [ "$TARGET" = "runtime-js" ]; then
            docker run --rm --platform "$PLATFORM" \
              --entrypoint /bin/sh "${IMAGE}:${VERSION}" \
              -c 'command -v chromium && test -x /usr/local/bin/crw-entrypoint'
            docker run --rm --platform "$PLATFORM" \
              "${IMAGE}:${VERSION}" crw-server --help >/dev/null
          fi
          # `--help` exits 0 without booting the server, so no config/network is
          # needed to prove crw-server is a working binary for this arch.
          docker run --rm --platform "$PLATFORM" \
            --entrypoint /usr/local/bin/crw-server "${IMAGE}:${VERSION}" --help >/dev/null
          docker image inspect "${IMAGE}:${VERSION}" \
            --format '{{.Architecture}} {{.Os}} {{.Size}} bytes {{len .RepoTags}} tags'

      - name: docker save → gzip archive
        shell: bash
        env:
          IMAGE: ${{ needs.release-context.outputs.image }}
          VERSION: ${{ needs.release-context.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          asset="crw-docker-${VERSION}-linux-${ARCH}.tar.gz"
          # Both tags travel inside the archive, so `docker load` restores the
          # canonical registry reference and an arch-qualified one.
          docker save -o "${RUNNER_TEMP}/image.tar" \
            "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-linux-${ARCH}"
          gzip -9 -c "${RUNNER_TEMP}/image.tar" > "$asset"
          rm -f "${RUNNER_TEMP}/image.tar"
          ls -lh "$asset"
          # Fails the leg on an empty/lfs-stubbed archive instead of attaching a
          # download that cannot be loaded.
          gzip -t "$asset"
          tar -tf <(gzip -dc "$asset") >/dev/null

      - name: Upload archive as a run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-linux-${{ matrix.arch }}
          path: crw-docker-${{ needs.release-context.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          # Already gzip -9'd; recompressing at the artifact layer only burns
          # CPU and time.
          compression-level: 0
          retention-days: 7

  attach-to-release:
    needs: [release-context, build-and-save]
    # Skipped (gray, not failed) on a build-only dry run — see release-context.
    if: ${{ needs.release-context.outputs.attach == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Uploading release assets is the one write this workflow performs.
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: docker-image-*
          path: dist
          merge-multiple: true

      - name: Verify the release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so there is no git remote for gh to infer
          # the target repo from — name it explicitly.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-context.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "::error::release '$TAG' does not exist — create it (or let release-please cut it) before attaching image archives"
            exit 1
          fi

      - name: Assemble checksums
        shell: bash
        env:
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist
          # One checksum file covering every architecture. Named apart from the
          # release's plain `SHA256SUMS` on purpose: that file is owned and
          # signed by release.yml's asset-gate, and clobbering it would drop a
          # cosign-verified manifest.
          ( cd dist && sha256sum "crw-docker-${VERSION}-linux-"*.tar.gz > "crw-docker-${VERSION}-SHA256SUMS" )
          cat "dist/crw-docker-${VERSION}-SHA256SUMS"

      - name: Attach archives to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-context.outputs.tag }}
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          set -euo pipefail
          # `cd dist` so the globs stay flat: gh release upload rejects a path
          # containing a directory component.
          cd dist
          gh release upload "$TAG" \
            crw-docker-"${VERSION}"-linux-*.tar.gz \
            crw-docker-"${VERSION}"-SHA256SUMS \
            --clobber

      - name: Verify the assets are downloadable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-context.outputs.tag }}
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          gh release download "$TAG" -D "$work" \
            -p "crw-docker-${VERSION}-linux-*.tar.gz" \
            -p "crw-docker-${VERSION}-SHA256SUMS"
          # `gh release download` verifies nothing, so hash the bytes we just
          # fetched against the manifest we published.
          ( cd "$work" && sha256sum -c "crw-docker-${VERSION}-SHA256SUMS" )
          printf '✓ image archives attached to %s:\n' "$TAG"
          ls -lh "$work"
